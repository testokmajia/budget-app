<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 - 待办事项 Tab Demo</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card-bg: #fff;
    --text: #303133;
    --text-secondary: #606266;
    --text-muted: #909399;
    --border: #e4e7ed;
    --brand: #006eff;
    --brand-light: #ecf5ff;
    --success: #0abf5b;
    --warning: #e6a23c;
    --danger: #f56c6c;
    --shadow: 0 1px 2px rgba(0,0,0,.03), 0 1px 6px -1px rgba(0,0,0,.06);
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); padding: 24px; color: var(--text); }

  .container { max-width: 900px; margin: 0 auto; }

  /* Tab bar */
  .tab-bar {
    display: flex; gap: 0; margin-bottom: 20px;
    background: var(--card-bg); border-radius: var(--radius);
    padding: 4px; box-shadow: var(--shadow);
  }
  .tab-item {
    flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 500;
    border-radius: 6px; cursor: pointer; color: var(--text-secondary); transition: all .2s;
  }
  .tab-item.active { background: var(--brand); color: #fff; }
  .tab-item:hover:not(.active) { color: var(--brand); background: var(--brand-light); }
  .tab-badge { display: inline-block; min-width: 20px; height: 20px; line-height: 20px;
    border-radius: 10px; font-size: 12px; background: var(--danger); color: #fff;
    text-align: center; margin-left: 6px; padding: 0 6px; }

  /* Stats row */
  .stats-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-card {
    flex: 1; background: var(--card-bg); border-radius: 6px; padding: 14px 16px;
    box-shadow: var(--shadow); border-left: 4px solid var(--brand);
  }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 600; color: var(--brand); }

  /* Section */
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-icon { font-size: 16px; }

  /* Task card */
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task-card {
    background: var(--card-bg); border-radius: var(--radius);
    padding: 16px 20px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 14px;
    transition: all .2s; cursor: pointer; border: 1px solid transparent;
  }
  .task-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    border-color: var(--brand);
  }
  .task-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .task-icon.req { background: #f0f5ff; color: #2f54eb; }
  .task-icon.report { background: #f6ffed; color: #52c41a; }
  .task-icon.issue { background: #fff7e6; color: #fa8c16; }
  .task-icon.weekly { background: #f9f0ff; color: #722ed1; }
  .task-info { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .task-desc { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-count {
    flex-shrink: 0; min-width: 24px; height: 24px; border-radius: 12px;
    font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    background: var(--danger); color: #fff; padding: 0 8px;
  }
  .task-arrow { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    background: var(--brand-light); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all .2s; }
  .task-card:hover .task-arrow { background: var(--brand); color: #fff; }

  /* Empty */
  .empty { text-align: center; padding: 60px 0; color: var(--text-muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* Responsive */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .task-card { padding: 12px 14px; gap: 10px; }
    .task-count { font-size: 11px; padding: 0 6px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Tab 切换 -->
  <div class="tab-bar">
    <div class="tab-item">📊 数据概览</div>
    <div class="tab-item active">📋 待办事项 <span class="tab-badge">7</span></div>
  </div>

  <!-- 分类统计 -->
  <div class="stats-row">
    <div class="stat-card" style="border-left-color: #2f54eb;">
      <div class="stat-label">需求相关</div>
      <div class="stat-value" style="color:#2f54eb;">3</div>
    </div>
    <div class="stat-card" style="border-left-color: #52c41a;">
      <div class="stat-label">测试报告</div>
      <div class="stat-value" style="color:#52c41a;">2</div>
    </div>
    <div class="stat-card" style="border-left-color: #fa8c16;">
      <div class="stat-label">问题相关</div>
      <div class="stat-value" style="color:#fa8c16;">1</div>
    </div>
    <div class="stat-card" style="border-left-color: #722ed1;">
      <div class="stat-label">周报相关</div>
      <div class="stat-value" style="color:#722ed1;">1</div>
    </div>
  </div>

  <!-- 需求相关待办 -->
  <div class="section">
    <div class="section-title">
      <span class="section-icon">📝</span> 需求相关
    </div>
    <div class="task-list">
      <div class="task-card">
        <div class="task-icon req">📋</div>
        <div class="task-info">
          <div class="task-title">需求待评估</div>
          <div class="task-desc">有待评估涉及系统的需求，需要您进行架构评估</div>
        </div>
        <div class="task-count">2</div>
        <div class="task-arrow">→</div>
      </div>
      <div class="task-card">
        <div class="task-icon req">✍️</div>
        <div class="task-info">
          <div class="task-title">需求说明书待确认</div>
          <div class="task-desc">需求说明书需要您确认（多方确认环节）</div>
        </div>
        <div class="task-count">1</div>
        <div class="task-arrow">→</div>
      </div>
    </div>
  </div>

  <!-- 测试报告相关待办 -->
  <div class="section">
    <div class="section-title">
      <span class="section-icon">🧪</span> 测试报告
    </div>
    <div class="task-list">
      <div class="task-card">
        <div class="task-icon report">✅</div>
        <div class="task-info">
          <div class="task-title">测试报告待确认</div>
          <div class="task-desc">您有待确认的测试报告，需要确认测试结果</div>
        </div>
        <div class="task-count">1</div>
        <div class="task-arrow">→</div>
      </div>
      <div class="task-card">
        <div class="task-icon report">🏛️</div>
        <div class="task-info">
          <div class="task-title">测试报告待部门审核</div>
          <div class="task-desc">您有测试报告需要部门负责人审核</div>
        </div>
        <div class="task-count">1</div>
        <div class="task-arrow">→</div>
      </div>
    </div>
  </div>

  <!-- 问题相关待办 -->
  <div class="section">
    <div class="section-title">
      <span class="section-icon">⚠️</span> 问题相关
    </div>
    <div class="task-list">
      <div class="task-card">
        <div class="task-icon issue">🔧</div>
        <div class="task-info">
          <div class="task-title">待处理问题</div>
          <div class="task-desc">分配给您的整改任务尚未完成</div>
        </div>
        <div class="task-count">1</div>
        <div class="task-arrow">→</div>
      </div>
    </div>
  </div>

  <!-- 空状态示例（默认隐藏） -->
  <!--
  <div class="empty">
    <div class="empty-icon">🎉</div>
    <div class="empty-text">太棒了，没有待办事项！</div>
  </div>
  -->

</div>
</body>
</html>
