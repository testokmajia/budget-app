<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 - 科技管理平台</title>
<style>
  :root {
    --brand: #006eff;
    --brand-hover: #0056cc;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #e5e7eb;
    --border-focus: #006eff;
    --error: #e03131;
    --success: #2f9e44;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 6px rgba(0,0,0,0.05), 0 10px 15px rgba(0,0,0,0.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }

  /* ========== 卡片容器 ========== */
  .reset-card {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    width: 420px;
    max-width: 94vw;
    padding: 40px 36px 36px;
  }

  .reset-card__header {
    text-align: center;
    margin-bottom: 32px;
  }

  .reset-card__logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  .reset-card__logo span {
    color: var(--brand);
  }

  .reset-card__desc {
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* ========== 步骤条 ========== */
  .steps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 32px;
    padding: 0 8px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .step__dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    background: var(--border);
    color: var(--text-secondary);
    transition: all 0.25s;
  }

  .step--active .step__dot {
    background: var(--brand);
    color: #fff;
  }

  .step--done .step__dot {
    background: var(--success);
    color: #fff;
  }

  .step__label {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .step--active .step__label {
    color: var(--brand);
    font-weight: 600;
  }

  .step--done .step__label {
    color: var(--success);
  }

  .steps__line {
    flex: 1;
    height: 2px;
    background: var(--border);
    min-width: 24px;
    margin: 0 8px;
    transition: background 0.25s;
  }

  .steps__line--done {
    background: var(--success);
  }

  /* ========== 表单区 ========== */
  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }

  .form-input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 15px;
    font-family: var(--font);
    color: var(--text);
    background: #fafbfc;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .form-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(0,110,255,0.1);
    background: #fff;
  }

  .form-input::placeholder {
    color: #c0c4cc;
  }

  .form-input--error {
    border-color: var(--error);
  }

  .form-error {
    font-size: 13px;
    color: var(--error);
    margin-top: 4px;
    display: none;
  }

  .form-error--visible {
    display: block;
  }

  /* ========== 验证码输入行 ========== */
  .code-row {
    display: flex;
    gap: 12px;
  }

  .code-row .form-input {
    flex: 1;
    letter-spacing: 6px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
  }

  .btn-send {
    width: 120px;
    height: 44px;
    flex-shrink: 0;
    border: 1px solid var(--brand);
    background: transparent;
    color: var(--brand);
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font);
  }

  .btn-send:hover:not(:disabled) {
    background: rgba(0,110,255,0.04);
  }

  .btn-send:disabled {
    border-color: var(--border);
    color: var(--text-secondary);
    cursor: not-allowed;
  }

  /* ========== 主按钮 ========== */
  .btn-primary {
    width: 100%;
    height: 46px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    font-family: var(--font);
    margin-top: 4px;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--brand-hover);
  }

  .btn-primary:disabled {
    background: #a0c4f0;
    cursor: not-allowed;
  }

  /* ========== 底部链接 ========== */
  .reset-card__footer {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .reset-card__footer a {
    color: var(--brand);
    text-decoration: none;
    cursor: pointer;
  }

  .reset-card__footer a:hover {
    text-decoration: underline;
  }

  /* ========== 成功提示 ========== */
  .success-box {
    text-align: center;
    padding: 20px 0;
  }

  .success-box__icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #ebfbee;
    color: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 16px;
  }

  .success-box__title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .success-box__desc {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  /* ========== 隐藏面板 ========== */
  .panel { display: none; }
  .panel--visible { display: block; }

  /* ========== 提示信息 ========== */
  .alert {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }

  .alert--visible { display: block; }
  .alert--info { background: #e7f5ff; color: #1971c2; }
  .alert--error { background: #fff5f5; color: #c92a2a; }
</style>
</head>
<body>

<div class="reset-card">

  <!-- ===== 头部 ===== -->
  <div class="reset-card__header">
    <div class="reset-card__logo">科技<span>管理</span>平台</div>
    <p class="reset-card__desc" id="headerDesc">重置您的登录密码</p>
  </div>

  <!-- ===== 步骤条 ===== -->
  <div class="steps" id="stepsBar">
    <div class="step step--active" id="step1">
      <div class="step__dot">1</div>
      <span class="step__label">填写邮箱</span>
    </div>
    <div class="steps__line" id="line1"></div>
    <div class="step" id="step2">
      <div class="step__dot">2</div>
      <span class="step__label">验证身份</span>
    </div>
    <div class="steps__line" id="line2"></div>
    <div class="step" id="step3">
      <div class="step__dot">3</div>
      <span class="step__label">重置密码</span>
    </div>
  </div>

  <!-- ===== 面板 1：输入邮箱 ===== -->
  <div class="panel panel--visible" id="panelEmail">
    <div class="alert alert--info alert--visible" id="alertEmail">
      请输入您的公司邮箱地址
    </div>
    <div class="alert alert--error" id="alertEmailError"></div>
    <div class="form-group">
      <label class="form-label" for="inputEmail">邮箱地址</label>
      <input type="email" class="form-input" id="inputEmail" placeholder="请输入注册邮箱" autocomplete="email">
      <p class="form-error" id="emailError">请输入有效的邮箱地址</p>
    </div>
    <button class="btn-primary" id="btnSendCode" onclick="sendCode()">
      发送验证码
    </button>
    <div class="reset-card__footer">
      <a onclick="goBackToLogin()">← 返回登录</a>
    </div>
  </div>

  <!-- ===== 面板 2：输入验证码 ===== -->
  <div class="panel" id="panelVerify">
    <div class="alert alert--info" id="alertVerify">
      验证码已发送至 <strong id="sentEmail">—</strong>，10 分钟内有效
    </div>
    <div class="alert alert--error" id="alertVerifyError"></div>
    <div class="form-group">
      <label class="form-label">验证码</label>
      <div class="code-row">
        <input type="text" class="form-input" id="inputCode" placeholder="000000" maxlength="6" autocomplete="one-time-code" inputmode="numeric">
        <button class="btn-send" id="btnResend" onclick="resendCode()">重新发送</button>
      </div>
      <p class="form-error" id="codeError">请输入6位验证码</p>
    </div>
    <button class="btn-primary" id="btnVerify" onclick="verifyCode()">
      下一步
    </button>
    <div class="reset-card__footer">
      <a onclick="goToStep(1)">← 更换邮箱</a>
    </div>
  </div>

  <!-- ===== 面板 3：重置密码 ===== -->
  <div class="panel" id="panelReset">
    <div class="alert alert--info" id="alertReset">
      请设置新密码，至少 8 位，包含字母和数字
    </div>
    <div class="alert alert--error" id="alertResetError"></div>
    <div class="form-group">
      <label class="form-label" for="inputNewPassword">新密码</label>
      <input type="password" class="form-input" id="inputNewPassword" placeholder="请输入新密码" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label" for="inputConfirmPassword">确认新密码</label>
      <input type="password" class="form-input" id="inputConfirmPassword" placeholder="请再次输入新密码" autocomplete="new-password">
      <p class="form-error" id="passwordError">两次密码不一致</p>
    </div>
    <button class="btn-primary" id="btnReset" onclick="resetPassword()">
      重置密码
    </button>
    <div class="reset-card__footer">
      <a onclick="goToStep(2)">← 重新验证</a>
    </div>
  </div>

  <!-- ===== 面板 4：完成 ===== -->
  <div class="panel" id="panelSuccess">
    <div class="success-box">
      <div class="success-box__icon">✓</div>
      <div class="success-box__title">密码重置成功</div>
      <div class="success-box__desc">请使用新密码重新登录</div>
      <button class="btn-primary" onclick="goBackToLogin()">返回登录</button>
    </div>
  </div>

</div>

<script>
  // ========== 步骤管理 ==========
  let currentStep = 1;
  let countdownTimer = null;
  let userEmail = '';

  function goToStep(step) {
    currentStep = step;
    // 更新面板
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('panel--visible'));
    const panels = ['panelEmail', 'panelVerify', 'panelReset', 'panelSuccess'];
    document.getElementById(panels[step - 1]).classList.add('panel--visible');

    // 更新步骤条
    updateSteps(step);

    // 更新标题
    const titles = ['填写注册邮箱', '输入验证码', '设置新密码', ''];
    document.getElementById('headerDesc').textContent = titles[step - 1];

    // 到步骤 2 时自动发码倒计时
    if (step === 2) {
      document.getElementById('sentEmail').textContent = userEmail;
      startResendCountdown();
    }

    // 步骤 3
    if (step === 3) {
      document.getElementById('inputNewPassword').value = '';
      document.getElementById('inputConfirmPassword').value = '';
    }
  }

  function updateSteps(activeStep) {
    for (let i = 1; i <= 3; i++) {
      const el = document.getElementById('step' + i);
      el.classList.remove('step--active', 'step--done');
      if (i < activeStep) el.classList.add('step--done');
      if (i === activeStep) el.classList.add('step--active');
    }
    document.getElementById('line1').classList.toggle('steps__line--done', activeStep > 1);
    document.getElementById('line2').classList.toggle('steps__line--done', activeStep > 2);
  }

  // ========== 步骤 1：发送验证码 ==========
  function sendCode() {
    const email = document.getElementById('inputEmail').value.trim();
    const errEl = document.getElementById('emailError');

    if (!email || !email.includes('@')) {
      errEl.classList.add('form-error--visible');
      return;
    }
    errEl.classList.remove('form-error--visible');
    userEmail = email;

    // 模拟发送（实际开发替换为 API 调用）
    hideAlert('alertEmail');
    showAlert('alertEmailError', '');

    // 模拟 loading
    const btn = document.getElementById('btnSendCode');
    btn.disabled = true;
    btn.textContent = '发送中...';

    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '发送验证码';
      goToStep(2);
    }, 800);
  }

  // ========== 步骤 2：重新发送倒计时 ==========
  function startResendCountdown() {
    let sec = 60;
    const btn = document.getElementById('btnResend');
    btn.disabled = true;

    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      sec--;
      if (sec <= 0) {
        clearInterval(countdownTimer);
        btn.disabled = false;
        btn.textContent = '重新发送';
        return;
      }
      btn.textContent = sec + 's 后重发';
    }, 1000);
  }

  function resendCode() {
    hideAlert('alertVerifyError');
    showAlert('alertVerify', '验证码已重新发送至 <strong>' + userEmail + '</strong>，10 分钟内有效');
    document.getElementById('alertVerify').classList.remove('alert--error');
    document.getElementById('alertVerify').classList.add('alert--info');
    document.getElementById('alertVerify').classList.add('alert--visible');
    document.getElementById('inputCode').value = '';
    startResendCountdown();
  }

  // ========== 步骤 3：校验验证码 ==========
  function verifyCode() {
    const code = document.getElementById('inputCode').value.trim();
    const errEl = document.getElementById('codeError');

    if (code.length !== 6 || !/^\d{6}$/.test(code)) {
      errEl.classList.add('form-error--visible');
      return;
    }
    errEl.classList.remove('form-error--visible');

    // 模拟校验
    const btn = document.getElementById('btnVerify');
    btn.disabled = true;
    btn.textContent = '校验中...';

    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '下一步';
      // 模拟成功跳转
      goToStep(3);
    }, 600);
  }

  // ========== 步骤 4：重置密码 ==========
  function resetPassword() {
    const pwd = document.getElementById('inputNewPassword').value;
    const confirmPwd = document.getElementById('inputConfirmPassword').value;
    const errEl = document.getElementById('passwordError');

    if (pwd !== confirmPwd) {
      errEl.classList.add('form-error--visible');
      return;
    }

    if (pwd.length < 8 || !/[a-zA-Z]/.test(pwd) || !/\d/.test(pwd)) {
      showAlert('alertResetError', '密码至少 8 位，必须包含字母和数字');
      return;
    }

    errEl.classList.remove('form-error--visible');
    hideAlert('alertResetError');

    const btn = document.getElementById('btnReset');
    btn.disabled = true;
    btn.textContent = '重置中...';

    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '重置密码';
      goToStep(4); // 成功页
    }, 800);
  }

  // ========== 辅助 ==========
  function goBackToLogin() {
    alert('实际项目中跳转至：/login');
  }

  function showAlert(id, msg) {
    const el = document.getElementById(id);
    el.innerHTML = msg;
    el.classList.add('alert--visible');
  }

  function hideAlert(id) {
    document.getElementById(id).classList.remove('alert--visible');
  }

  // ========== 键盘回车支持 ==========
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    if (currentStep === 1) sendCode();
    else if (currentStep === 2) verifyCode();
    else if (currentStep === 3) resetPassword();
  });

  // ========== 验证码输入自动 focus 下一个输入框的优化 ==========
  document.getElementById('inputCode').addEventListener('input', function(e) {
    // 只允许数字
    this.value = this.value.replace(/\D/g, '');
  });
</script>

</body>
</html>
